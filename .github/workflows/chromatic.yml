name: Chromatic

# Publishes Storybook to Chromatic so every component's visual history is
# tracked across commits. Requires a CHROMATIC_PROJECT_TOKEN repo secret
# (Settings → Secrets and variables → Actions).
#
# Runs on every push to any branch, not on `pull_request`, as Chromatic's
# docs recommend. A `pull_request` run builds GitHub's temporary merge of
# the branch into the latest main. Its snapshots then include changes from
# main that the PR did not make, and those show up as changes to accept.
# That matters because "UI Tests" is a required check on main: pending
# changes block the merge.
on:
  push:
    branches: ["**"]

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Chromatic needs full git history to compare against past baselines.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Publish to Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
